{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}
{% block extra_css %}
<link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
{% endblock %}

<!-- Flash Messages -->
<div class="container mt-3">
    {% include "flash_messages.html" %}
</div>

<main class="flex-grow-1">

    {% block content %}
    <div class="bg-index">
        <div class="formulario col">
            <form method="POST" action="{{ url_for('auth.login') }}">

                <h2 class="mt-3 hidden_desktop">BIENVENIDOS</h2>
                <div class="user mb-5">
                    <label class="hidden_mobile" for="label-for">Usuario</label>
                    <div class="form-group">
                        <input type="text" name="username" id="username" class="input" placeholder="Usuario">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="user mb-2 ">
                    <label class="hidden_mobile" for="label-for">Contraseña</label>
                    <div class="form-group">
                        <input type="password" name="password" id="password" class="input" placeholder="Contraseña">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
                <div class="links">
                    <a href="{{ url_for('auth.forgot_password') }}">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="mb-3 form-checked">
                    <input type="checkbox" class="gx-0 gy-0" id="remember" name="remember">
                    <label class="gx-0 gy-0 label" for="remember">Recordarme</label>
                </div>
                <div>
                    <button type="submit" class="btn boton">Iniciar</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    function openPassword(){
        let iconPassword = document.querySelector('.fa-lock');
        let inputPassword = document.getElementById('password');
        let isTypePassword = true;
        if(!iconPassword || !inputPassword) return false
        iconPassword.addEventListener('click',()=>{
            if(isTypePassword){
                inputPassword.setAttribute('type','text');
                isTypePassword= false;
            }else{
                inputPassword.setAttribute('type','password')
                isTypePassword= true;
            }
            
        })
    }
    openPassword();
</script>
{% endblock %}
