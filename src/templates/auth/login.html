{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<main class="login">
    <img class="login__bg" src="{{ url_for('static', filename='images/login/login-bg.svg') }}" alt="">

    <header class="login__hero">
        <img class="login__logo" src="{{ url_for('static', filename='images/login/logo-gimsipei.svg') }}"
            alt="Gimnasio Psicopedagógico Integral GIMSIPEI" width="549" height="96">
        <h1 class="login__welcome">Bienvenido</h1>
    </header>

    <section class="login__panel" aria-labelledby="loginTitle">
        <!-- Tiene que estar dentro del bloque: Jinja descarta lo que queda afuera -->
        <div class="login__alerts">
            {% include "flash_messages.html" %}
        </div>

        <form class="login__form" method="POST" action="{{ url_for('auth.login') }}">
            <h2 class="login__title" id="loginTitle">Iniciar Sesión</h2>

            <label class="visually-hidden" for="username">Usuario</label>
            <input class="login__input" type="text" name="username" id="username" placeholder="Usuario"
                autocomplete="username" autocapitalize="none" spellcheck="false" required>

            <label class="login__label" for="password">Contraseña</label>
            <div class="login__password">
                <input class="login__input" type="password" name="password" id="password" placeholder="Contraseña"
                    autocomplete="current-password" required>
                <button class="login__toggle" type="button" id="loginTogglePassword" aria-controls="password"
                    aria-pressed="false" aria-label="Mostrar contraseña">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
            </div>

            <div class="login__options">
                <label class="login__remember" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Recordarme
                </label>
                <a class="login__forgot" href="{{ url_for('auth.forgot_password') }}">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="login__submit">Iniciar</button>
        </form>
    </section>
</main>

<script>
    (function () {
        const input = document.getElementById("password");
        // Id propio: main.js engancha su toggle generico a #togglePassword y con
        // los dos handlers cada click cambiaba el tipo dos veces (quedaba igual)
        const toggle = document.getElementById("loginTogglePassword");
        if (!input || !toggle) return;

        toggle.addEventListener("click", () => {
            const show = input.type === "password";
            input.type = show ? "text" : "password";
            toggle.setAttribute("aria-pressed", String(show));
            toggle.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
            toggle.querySelector("i").className = show ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
            input.focus();
        });
    })();
</script>
{% endblock %}
