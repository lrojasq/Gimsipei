{% block menu %}

<style>
  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    /* evitamos scroll nativo */
  }

  .section {
    height: 100vh;
    /* cada sección ocupa toda la pantalla */
    display: flex;
    align-items: start;
    justify-content: center;
    flex-direction: column;
    box-sizing: border-box;
    overflow: hidden;
  }

  h2 {
    font-size: 3rem;
    margin-bottom: 20px;
  }

  p {
    font-size: 1.2rem;
    max-width: 800px;
    text-align: left;
  }
  
  .mobile-header{
    position: relative;
  }
  .mobile-header:has(+ .teachers_management),
  .mobile-header:has(+ .courses_management) {
    background-color: white;
  }
  .mobile-header:has(+ .teachers_management):after,
  .mobile-header:has(+ .courses_management):after{
    content: "";
    height: 2px;
    border-radius: 5px;
    width: 98%;
    position: absolute;
    left: 0px;
    right: 0px;
    margin: auto;
    bottom: 0px;
    background: red;
  }
  .mobile-header:has(+ .teachers_management)  .logo,
  .mobile-header:has(+ .courses_management) .logo{
    background-color: red;
  }
  .mobile-header:has(+ .teachers_management)  .hamburger-menu span,
  .mobile-header:has(+ .courses_management) .hamburger-menu span{
    background-color: gray;
  }

  @media (max-width:1080px) {
    body {
      overflow: auto;
    }
  }
</style>
<header class="mobile-header">
  <div class="logo">
    <!-- <img src="https://via.placeholder.com/150x50?text=LOGO" alt="Logo"> -->
  </div>

  <div class="header-content">
    <div class="user-profile">
      <img src="/static/images/avatares/buho.png" alt="Foto de usuario">
    </div>

    <div class="hamburger-menu" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <nav class="mobile-nav" id="mobileNav">
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Perfil</a></li>
      <li><a href="#">Configuración</a></li>
      <li><a href="#">Notificaciones</a></li>

      {% if accion_logout %}
      {% include "utils/logout_button.html" %}
      {% endif %}
    </ul>
  </nav>
</header>

{% endblock %}
