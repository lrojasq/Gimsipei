<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
    :root {
        --evaluaciones: #f48d53;
        --evaluaciones-active: #e55d1a;
    }

    #formModalEvaluation {
        z-index: 999999;
    }

    /* Fondo global del modal */
    .modal-content {
        background-color: var(--evaluaciones) !important;
    }

    /* Botones */
    .btn-primary,
    .btn-success,
    .btn-secondary {
        background-color: var(--evaluaciones) !important;
        border-color: var(--evaluaciones) !important;
        color: white !important;
    }

    .btn-primary:hover,
    .btn-success:hover,
    .btn-secondary:hover {
        background-color: #e77d44 !important;
        border-color: #e77d44 !important;
    }

    .btn-outline-primary {
        color: white !important;
        border-color: white !important;
    }

    .btn-outline-primary:hover {
        background-color: white !important;
        color: gray !important;
    }

    /* Campos de texto */
    .form-control,
    .form-select {
        border-color: var(--evaluaciones-active);
    }

    .form-control:focus,
    .form-select:focus {
        border-color: var(--evaluaciones-active);
        box-shadow: 0 0 0 0.25rem rgba(196, 87, 43, 0.3);
    }

    .step {
        min-height: 270px;
    }

    .modal-content .progress-bar {
        background-color: var(--evaluaciones-active);
    }

    #formModalEvaluation .file-upload-group {
        position: relative;
    }

    #formModalEvaluation .file-upload-label {
        display: block;
        width: 100%;
        padding: 1rem 1.25rem;
        background-color: var(--evaluaciones-active);
        color: white;
        font-size: 1rem;
        font-weight: 500;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    #formModalEvaluation .file-upload-label:hover {
        background-color: var(--evaluaciones-active);
    }

    #formModalEvaluation input[type="file"] {
        display: none;
    }

    #formModalEvaluation .file-name {
        display: block;
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: hsl(0, 0%, 45%);
    }
</style>

<!-- BOTÓN PARA ABRIR EL MODAL -->
<div class="container text-center mt-4">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#formModalEvaluation">
        Crear Formulario
    </button>
</div>

<!-- MODAL COMPLETO -->
<div class="modal fade" id="formModalEvaluation" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <!-- CABECERA -->
            <div class="modal-header text-white" style="background:#e77236;">
                <h5 class="modal-title">Crear Formulario</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <!-- CUERPO DEL MODAL -->
            <div class="modal-body">

                <!-- STEP 0: INFO GENERAL -->
                <div id="step0" class="step">
                    <h5>Información General</h5>
                    <input id="titulo" class="form-control mb-3" placeholder="Título" oninput="validateFormInfo()" />
                    <div class="form-group file-upload-group">
                        <label for="img_evaluaciones" class="file-upload-label">
                            <i class="fas fa-upload"></i> AGREGAR PORTADA
                        </label>
                        <input type="file" name="img_evaluaciones" id="img_evaluaciones" required accept="image/*"
                            onchange="document.getElementById('img_evaluaciones_name').textContent = this.files[0]?.name || ''; validateFormInfo();">
                        <span class="file-name" id="img_evaluaciones_name"></span>
                    </div>
                    <textarea id="descripcion" class="form-control mb-3" placeholder="Descripción" rows="3"
                        oninput="validateFormInfo()"></textarea>
                    <select id="periodo" class="form-select mb-3" onchange="validateFormInfo()">
                        <option value="">Seleccione un periodo</option>
                        <option value="Enero-Abril">PERIODO 1</option>
                        <option value="Mayo-Agosto">PERIODO 2</option>
                        <option value="Septiembre-Diciembre">PERIODO 3</option>
                        <option value="Anual">PERIODO 4</option>
                    </select>
                </div>

                <!-- CONTENEDOR DE LAS 10 PREGUNTAS -->
                <div id="questionsContainer"></div>

                <div class="progress mt-3">
                    <div id="progressBar" class="progress-bar" style="width:0%"></div>
                </div>
            </div>

            <!-- PIE DEL MODAL -->
            <div class="modal-footer d-flex justify-content-between">
                <button class="btn btn-secondary" id="prevBtn" onclick="prevStep()" style="display:none;">←
                    Anterior</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextStep()" disabled>Siguiente →</button>
                <button class="btn btn-success" id="finishBtn" onclick="finishForm()" style="display:none;"
                    disabled>Finalizar</button>
            </div>
        </div>
    </div>
</div>

<script>
    /* ----- CONTROL DE PASOS ----- */
    let currentStep = 0;
    const totalSteps = 11; // 1 info + 10 preguntas

    /* ----- MODELO DE PREGUNTAS ----- */
    const questions = Array.from({ length: 10 }).map(() => ({
        text: "",
        type: "open",
        options: {},
        answer: "",
    }));

    const container = document.getElementById("questionsContainer");

    /* ----- Generar letras A,B,C... ----- */
    function optionLetter(index) { return String.fromCharCode(65 + index); }

    /* ----- CREAR LAS 10 PREGUNTAS DINÁMICAS ----- */
    questions.forEach((q, i) => {
        const step = document.createElement("div");
        step.id = "step" + (i + 1);
        step.classList.add("step");
        step.style.display = "none";
        step.innerHTML = `
      <h5>Pregunta ${i + 1}</h5>
      <input class="form-control mb-3" placeholder="Escriba la pregunta" 
        oninput="questions[${i}].text=this.value; validateQuestion(${i})" />
      <select class="form-select mb-3" onchange="questions[${i}].type=this.value; toggleOptions(${i}); validateQuestion(${i})">
        <option value="open">Respuesta abierta</option>
        <option value="multi">Opción múltiple</option>
      </select>

      <div id="optionsBox${i}" style="display:none;">
        <h6>Opciones</h6>
        <div id="optList${i}"></div>
        <button class="btn btn-outline-primary btn-sm mt-2" onclick="addOption(${i})">
          + Añadir opción
        </button>
      </div>

      <select id="answerSelect${i}" class="form-select mt-3" style="display:none;" onchange="selectCorrectAnswer(${i}, this.value)">
        <option value="">Seleccione la respuesta correcta</option>
      </select>
    `;
        container.appendChild(step);
    });

    /* ----- MOSTRAR/OCULTAR OPCIONES Y SELECTOR DE RESPUESTA ----- */
    function toggleOptions(i) {
        const box = document.getElementById("optionsBox" + i);
        const answerSelect = document.getElementById("answerSelect" + i);

        if (questions[i].type === "multi") {
            box.style.display = "block";
            answerSelect.style.display = "block";
            questions[i].options = {};
            document.getElementById("optList" + i).innerHTML = "";
        } else {
            box.style.display = "none";
            answerSelect.style.display = "none";
            questions[i].options = {};
            questions[i].answer = "";
        }
        validateQuestion(i);
    }

    /* ----- AGREGAR OPCIONES ----- */
    function addOption(i) {
        const val = prompt("Escriba la opción:");
        if (!val) return;
        const q = questions[i];
        const index = Object.keys(q.options).length;
        const letter = optionLetter(index);
        q.options[letter] = val;
        refreshOptionList(i);
        refreshAnswerSelect(i);
        validateQuestion(i);
    }

    /* ----- VALIDAR INFO GENERAL ----- */
    function validateFormInfo() {
        const titulo = document.getElementById("titulo").value.trim();
        const desc = document.getElementById("descripcion").value.trim();
        const periodo = document.getElementById("periodo").value.trim();
        const fileOk = !!document.getElementById("img_evaluaciones").files[0];

        document.getElementById("nextBtn").disabled = !(titulo && desc && periodo && fileOk);
    }

    /* ----- VALIDAR UNA PREGUNTA INDIVIDUAL ----- */
    function validateQuestion(i) {
        const q = questions[i];
        const textOk = q.text.trim().length > 0;

        let valid = textOk;
        if (q.type === "multi") {
            const letters = Object.keys(q.options);
            const answerOk = letters.includes(q.answer);
            valid = valid && letters.length >= 2 && answerOk;
        }

        document.getElementById("nextBtn").disabled = !valid;

        if (i === 9) {
            document.getElementById("finishBtn").disabled = !questions.every(isQuestionValid);
        }
    }

    function isQuestionValid(q) {
        if (!q.text.trim()) return false;
        if (q.type === "multi") {
            const letters = Object.keys(q.options);
            return letters.length >= 2 && letters.includes(q.answer);
        }
        return true;
    }

    /* ----- STEP SIGUIENTE/ANTERIOR ----- */
    function nextStep() {
        document.getElementById("step" + currentStep).style.display = "none";
        currentStep++;
        document.getElementById("step" + currentStep).style.display = "block";
        updateUI();
        if (currentStep > 0 && currentStep <= 10) validateQuestion(currentStep - 1);
    }
    function prevStep() {
        document.getElementById("step" + currentStep).style.display = "none";
        currentStep--;
        document.getElementById("step" + currentStep).style.display = "block";
        updateUI();
    }

    /* ----- ACTUALIZAR UI ----- */
    function updateUI() {
        const prev = document.getElementById("prevBtn");
        const next = document.getElementById("nextBtn");
        const fin = document.getElementById("finishBtn");

        prev.style.display = currentStep === 0 ? "none" : "inline-block";
        next.style.display = currentStep === 10 ? "none" : "inline-block";
        fin.style.display = currentStep === 10 ? "inline-block" : "none";

        document.getElementById("progressBar").style.width = (currentStep / 10) * 100 + "%";
    }

    /* ----- SELECCIONAR RESPUESTA CORRECTA ----- */
    function selectCorrectAnswer(i, value) {
        questions[i].answer = value;
        validateQuestion(i);
    }

    /* ----- ACTUALIZAR LISTA DE OPCIONES ----- */
    function refreshOptionList(i) {
        const q = questions[i];
        const list = document.getElementById("optList" + i);
        list.innerHTML = "";
        Object.entries(q.options).forEach(([letter, text]) => {
            const item = document.createElement("div");
            item.className = "border p-2 my-1 rounded bg-light d-flex justify-content-between align-items-center";
            item.innerHTML = `<div><strong>${letter})</strong> ${text}</div>
            <button class="btn btn-sm btn-danger" onclick="deleteOption(${i}, '${letter}')">X</button>`;
            list.appendChild(item);
        });
    }

    /* ----- ELIMINAR OPCIÓN ----- */
    function deleteOption(i, letter) {
        const q = questions[i];
        delete q.options[letter];
        // regenerar letras
        const values = Object.values(q.options);
        q.options = {};
        values.forEach((val, idx) => { q.options[optionLetter(idx)] = val; });
        refreshOptionList(i);
        refreshAnswerSelect(i);
        validateQuestion(i);
    }

    /* ----- ACTUALIZAR SELECTOR DE RESPUESTA CORRECTA ----- */
    function refreshAnswerSelect(i) {
        const q = questions[i];
        const select = document.getElementById("answerSelect" + i);
        select.innerHTML = `<option value="">Seleccione la respuesta correcta</option>`;
        Object.entries(q.options).forEach(([letter, text]) => {
            const option = document.createElement("option");
            option.value = letter;
            option.textContent = `${letter}) ${text}`;
            select.appendChild(option);
        });
        if (!q.options[q.answer]) { q.answer = ""; select.value = ""; }
    }

    /* ----- FINALIZAR FORMULARIO ----- */
    function finishForm() {
        const titulo = document.getElementById("titulo").value;
        const descripcion = document.getElementById("descripcion").value;
        const periodo = document.getElementById("periodo").value;
        const imgFile = document.getElementById("img_evaluaciones").files[0]; // archivo seleccionado

        const formData = new FormData();
        formData.append("titulo", titulo);
        formData.append("descripcion", descripcion);
        formData.append("periodo", periodo);
        formData.append("img_portada", imgFile); // se incluye el archivo
        formData.append("preguntas", JSON.stringify(questions));

        // Mostrar en consola para verificar
        console.log("Formulario listo para enviar:", formData);

        // EJEMPLO de envío a servidor con fetch
        /*
        fetch("/ruta/del/servidor", {
            method: "POST",
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            alert("Formulario enviado con éxito");
            console.log(data);
        })
        .catch(err => {
            console.error("Error al enviar el formulario:", err);
        });
        */

        alert("Formulario listo. Revisa la consola para verificar FormData.");
    }

</script>
