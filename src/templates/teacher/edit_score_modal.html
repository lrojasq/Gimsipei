<!-- Modal para editar nota de evaluación -->
<div class="modal-overlay" id="editScoreModal" style="display: none;">
    <div class="modal-container">
        <div class="modal-header modal-header-evaluaciones">
            <h3><i class="fas fa-edit"></i> EDITAR NOTA</h3>
            <button type="button" class="modal-close" onclick="closeEditScoreModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="form-group">
            <label>ESTUDIANTE</label>
            <p class="modal-info-text" id="editScoreStudentName"></p>
        </div>
        <div class="form-group">
            <label>EVALUACIÓN</label>
            <p class="modal-info-text" id="editScoreEvalTitle"></p>
        </div>
        <div class="form-group">
            <label for="editScoreInput">NUEVA NOTA *</label>
            <input type="number" id="editScoreInput" min="0" max="5" step="0.1" value="0"
                placeholder="Ingrese nota (0.0 - 5.0)" required>
            <small style="color: #999;">El valor debe estar entre 0.0 y 5.0</small>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-cancel" onclick="closeEditScoreModal()">CANCELAR</button>
            <button type="button" class="btn-submit btn-submit-evaluaciones" id="saveEditScoreBtn"
                onclick="saveEditScore()">
                <span class="btn-text"><i class="fas fa-save"></i> GUARDAR</span>
                <span class="btn-spinner" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i> GUARDANDO...
                </span>
            </button>
        </div>
    </div>
</div>
