<!-- Modal de Confirmación de Reinicio de Evaluación -->
<div class="modal-overlay" id="resetEvaluationModal" style="display: none;">
    <div class="modal-container">
        <div class="modal-header modal-header-evaluaciones">
            <h3><i class="fas fa-redo-alt"></i> REINICIAR EVALUACIÓN</h3>
            <button type="button" class="modal-close" id="closeResetModal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="form-group">
            <div class="reset-warning-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <p class="reset-warning-text">
                ¿Está seguro que desea reiniciar la evaluación <strong id="resetEvalTitle"></strong>
                para el estudiante <strong id="resetStudentName"></strong>?
            </p>
            <p class="reset-info-text">
                <i class="fas fa-info-circle"></i> Esta acción eliminará las respuestas del estudiante
                y le permitirá volver a presentar la evaluación.
            </p>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancelResetBtn">CANCELAR</button>
            <form id="resetEvaluationForm" method="POST" action="" style="margin: 0;">
                <button type="submit" class="btn-submit btn-submit-evaluaciones" id="confirmResetBtn">
                    <span class="btn-text"><i class="fas fa-redo-alt"></i> REINICIAR</span>
                    <span class="btn-spinner" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i> PROCESANDO...
                    </span>
                </button>
            </form>
        </div>
    </div>
</div>
