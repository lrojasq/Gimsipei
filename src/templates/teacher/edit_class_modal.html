<!-- Modal: Editar Clase -->
<div class="modal-overlay" id="editClassModal" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3>EDITAR CLASE</h3>
            <button class="modal-close" onclick="closeEditClassModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="editClassForm" method="POST" action="" enctype="multipart/form-data">
            <input type="hidden" name="course_id" id="edit_class_course_id">
            <input type="hidden" name="subject_id" id="edit_class_subject_id">
            <input type="hidden" name="class_id" id="edit_class_id">

            <div class="form-group">
                <input type="number" name="class_number" id="edit_class_number" placeholder="NÚMERO DE CLASE" required
                    min="1">
            </div>

            <div class="form-group">
                <input type="text" name="title" id="edit_class_title" placeholder="TÍTULO" required maxlength="100">
            </div>

            <div class="form-group">
                <textarea name="description" id="edit_class_description" placeholder="DESCRIPCIÓN" rows="4"
                    maxlength="255"></textarea>
            </div>

            <div class="form-group">
                <select name="period" id="edit_class_period" class="period-select" required>
                    <option value="">SELECCIONA PERIODO</option>
                    <option value="1">PERIODO 1</option>
                    <option value="2">PERIODO 2</option>
                    <option value="3">PERIODO 3</option>
                    <option value="4">PERIODO 4</option>
                </select>
            </div>

            <div class="form-group file-upload-group">
                <label for="edit_class_cover" class="file-upload-label">
                    <i class="fas fa-upload"></i> CAMBIAR PORTADA
                </label>
                <input type="file" name="cover_image" id="edit_class_cover" accept="image/*">
                <span class="file-name" id="edit_class_cover_name"></span>
                <div id="current_cover_preview" style="margin-top: 10px; display: none;">
                    <p style="font-size: 0.875rem; color: #666;">Portada actual:</p>
                    <img id="current_cover_image" src="" alt="Portada actual"
                        style="max-width: 150px; border-radius: 8px;">
                </div>
            </div>

            <div class="modal-actions">
                <button type="submit" class="btn-submit">ACTUALIZAR</button>
            </div>
        </form>
    </div>
</div>
