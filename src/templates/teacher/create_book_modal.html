<!-- Crear Libro Modal -->
<div class="modal-overlay" id="createBookModal">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="bookModalTitle">CREAR LIBRO</h3>
            <button class="modal-close" onclick="closeCreateBookModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="createBookForm" method="POST" action="{{ url_for('books.create_book') }}"
            enctype="multipart/form-data">
            <input type="hidden" name="book_id" id="book_id">

            <!-- Datos principales del libro -->
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="title" id="book_title" placeholder="TÍTULO" required maxlength="255">
                </div>
                <div class="form-group">
                    <input type="text" name="author" id="book_author" placeholder="AUTOR" required maxlength="255">
                </div>
            </div>

            <div class="form-group">
                <textarea name="description" id="book_description" placeholder="DESCRIPCIÓN" rows="6"
                    maxlength="1000"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <select name="target_audience" id="book_target_audience" required>
                        <option value="">AUDIENCIA</option>
                        <option value="STUDENT">Estudiantes</option>
                        <option value="TEACHER">Docentes</option>
                    </select>
                </div>
                <div class="form-group">
                    <select name="grade_level" id="book_grade_level">
                        <option value="">GRADO (opcional)</option>
                        <option value="6">6° Grado</option>
                        <option value="7">7° Grado</option>
                        <option value="8">8° Grado</option>
                        <option value="9">9° Grado</option>
                        <option value="10">10° Grado</option>
                        <option value="11">11° Grado</option>
                    </select>
                </div>
            </div>

            <!-- Archivos -->
            <div class="form-row">
                <div class="form-group file-upload-group">
                    <label for="book_file" class="file-upload-label">
                        <i class="fas fa-upload"></i> AGREGAR LIBRO (EPUB)
                    </label>
                    <input type="file" name="book_file" id="book_file" accept=".epub">
                    <span class="file-name" id="book_file_name"></span>
                </div>

                <div class="form-group file-upload-group">
                    <label for="book_cover_image" class="file-upload-label">
                        <i class="fas fa-upload"></i> AGREGAR PORTADA
                    </label>
                    <input type="file" name="cover_image" id="book_cover_image" accept="image/*">
                    <span class="file-name" id="book_cover_image_name"></span>
                </div>
            </div>

            <div class="modal-actions">
                <button type="submit" class="btn-submit" id="submitBookBtn">
                    <span class="btn-text">GUARDAR</span>
                    <span class="btn-spinner" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i> GUARDANDO...
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
