{% extends "base.html" %}

{% block title %}Editar Usuario{% endblock %}

{% block extra_css %}
    <link href="{{ url_for('static', filename='css/menu.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/category.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
    {% block menu %}{% endblock %}

    <div class="container_category flex admin_category teachers_management">
        <!-- Perfil de Usuario -->
        {% include "user_profile.html" %}

        <div class="specialities_category flex">
            <div class="content-admin flex flex-column">
                <div class="form-crear flex">
                    <form method="POST" class="form-admin flex flex-column" id="editTeacherForm">
                        <div class="content-form flex flex-column">
                            <h1 class="right-text">Editar Usuario</h1>
                            <div class="flex flex-form">
                                <div class="img-usuario" style="width: 200px; height: 200px;">
                                    <img src="{{ url_for('static', filename='images/avatares/' ~ (teacher.avatar or 'buho.png')) }}"
                                         alt="Avatar del docente">
                                </div>
                                <div class="flex flex-column form-crear-content">
                                    <div class="flex input-group">
                                        <input type="text"
                                               name="full_name"
                                               id="full_name"
                                               placeholder="Nombre"
                                               value="{{ teacher.full_name }}"
                                               required>
                                    </div>
                                    <div class="flex input-group">
                                        <input type="text"
                                               name="document"
                                               id="document"
                                               placeholder="Documento"
                                               value="{{ teacher.document }}"
                                               required>
                                    </div>
                                    <div class="flex input-group">
                                        <input type="text"
                                               name="username"
                                               id="username"
                                               placeholder="Usuario"
                                               value="{{ teacher.username }}"
                                               required>
                                    </div>
                                    <div class="flex input-group">
                                        <input type="password"
                                               name="password"
                                               id="password"
                                               placeholder="Nueva contraseña (opcional)">
                                    </div>

                                    <!-- Selección de rol explícita -->
                                    <div class="container mt-3">
                                        <div class="btn-group flex justify-content-around"
                                             role="group"
                                             aria-label="Tipo de usuario">
                                            <input type="radio"
                                                   class="btn-check"
                                                   name="role"
                                                   id="docente"
                                                   value="teacher"
                                                   autocomplete="off"
                                                   {% if teacher.role=='teacher' %}checked{% endif %}>
                                            <label class="btn btn-outline-danger" for="docente">DOCENTE</label>
                                            <input type="radio"
                                                   class="btn-check"
                                                   name="role"
                                                   id="admin"
                                                   value="admin"
                                                   autocomplete="off"
                                                   {% if teacher.role=='admin' %}checked{% endif %}>
                                            <label class="btn btn-outline-danger" for="admin">ADMINISTRADOR</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="flex" style="gap:12px;">
                            <a href="{{ url_for('users.teachers_management') }}"
                               class="btn-admin btn-cancelar">VOLVER</a>
                            <button type="submit" class="btn-admin">ACTUALIZAR</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        {% include "sidebar_aside.html" %}
    </div>

    <script src="{{ url_for('static', filename='js/teachers_management.js') }}"></script>
{% endblock %}
