<!-- Flash Messages Partial - Fixed Overlay -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-messages-container">
{% for category, message in messages %}
    <div class="flash-message flash-{{ category }} fade-in" role="alert">
        <div class="flash-content">
            <i class="fas fa-{% if category == 'success' %}check-circle{% elif category == 'danger' %}exclamation-triangle{% elif category == 'warning' %}exclamation-circle{% else %}info-circle{% endif %} flash-icon"></i>
            <span class="flash-text">{{ message }}</span>
        </div>
        <button type="button" class="flash-close" onclick="this.parentElement.remove()">
            <i class="fas fa-times"></i>
        </button>
</div>
{% endfor %}
</div>
{% endif %}
{% endwith %}
