<!-- Delete Confirmation Modal -->
<div class="modal modal_delete" id="deleteConfirmationModal" aria-hidden="true">
    <div class="bg-back close-modal"></div>
    <div class="container">
        <div class="delete-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h2 class="delete-title">¿Está seguro que desea eliminar el registro?</h2>
        <p class="delete-warning">Esta operación es irreversible</p>
        <form method="POST" action="" id="deleteConfirmationForm">
            <div class="delete-buttons">
                <button type="button" class="btn btn-cancel close-modal">CANCELAR</button>
                <button type="submit" class="btn btn-delete">ELIMINAR</button>
            </div>
        </form>
    </div>
</div>
