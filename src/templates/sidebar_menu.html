
<!-- Sidebar Menu Component -->
<!-- Admin Menu -->
{% if user.role == "ADMIN" %}
    <div class="specialities_category flex">
        <div class="content-admin flex flex-column">
            <h2>Administrar</h2>
            <div class="flex">
                <a href="{{ url_for('users.teachers_management') }}">
                    <div class="box-menu clases-hover">
                        <img src="{{ url_for('static', filename='images/svg/clases.svg') }}" alt="Docentes" style="width: 80px; height: 80px;">
                        <p>Docente</p>
                        <div class="barra barra-clases"></div>
                    </div>
                </a>
                <a href="{{ url_for('courses.courses_management') }}">
                    <div class="box-menu libros-hover">
                        <img src="{{ url_for('static', filename='images/svg/libros.svg') }}" alt="Cursos" style="width: 80px; height: 60px;">
                        <p>Cursos</p>
                        <div class="barra barra-libros"></div>
                    </div>
                </a>
            </div>
        </div>
    </div>
{% endif %}
